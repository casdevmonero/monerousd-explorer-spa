<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Ion Swap">
  <defs>
    <radialGradient id="ion-nucleus" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb066"/>
      <stop offset="60%" stop-color="#ff6600"/>
      <stop offset="100%" stop-color="#a83e00"/>
    </radialGradient>
    <filter id="ion-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(32 32)" filter="url(#ion-glow)">
    <!-- three tilted electron orbits -->
    <g fill="none" stroke="#ff6600" stroke-opacity="0.55" stroke-width="1.5">
      <ellipse rx="27" ry="10" transform="rotate(0)"/>
      <ellipse rx="27" ry="10" transform="rotate(60)"/>
      <ellipse rx="27" ry="10" transform="rotate(120)"/>
    </g>
    <!-- electrons -->
    <g fill="#ffffff">
      <circle cx="27" cy="0" r="2.2"/>
      <g transform="rotate(60)"><circle cx="-27" cy="0" r="2.2"/></g>
      <g transform="rotate(120)"><circle cx="27" cy="0" r="2.2"/></g>
    </g>
    <!-- nucleus -->
    <circle r="9" fill="url(#ion-nucleus)"/>
    <circle r="9" fill="none" stroke="#ff6600" stroke-opacity="0.95" stroke-width="0.8"/>
  </g>
</svg>
